<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="outerdiv">
        <header>
            <div class="title_bar">
                <button class="user-btn">User_Name<i class="fa-solid fa-caret-down"></i></button>
                <div class="rightButton">
                    <i class="fa-regular fa-square-plus" id="New-post"></i>
                    <i class="fa-solid fa-bars" id="menu-btn"></i>
                </div>
            </div>
        </header>
        <main>
            <div class="user-info">
                <div class="user-photo"><img src="100k-ai-faces-6.jpg" alt="profile picture"></div>
                <div class="stat">
                    <h3>0</h3>
                    <p>Posts</p>
                </div>
                <div class="stat">
                    <h3>0</h3>
                    <p>Followers</p>
                </div>
                <div class="stat">
                    <h3>0</h3>
                    <p>Following</p>
                </div>
            </div>
            <div class="bio">success comes from small but constituents efforts</div>
            <div class="editProfile">
                <button id="Edit_Profile">Edit profile</button>
                <button id="Share_Profile">Share profile</button>
                <i class="fa-solid fa-circle-plus" id="suggestionButton"></i>
            </div>
            <div class="highLightSection">
                <div class="highlight">
                    <img src="plus.png" alt="">
                    <p>name</p>
                </div>
            </div>
            <div class="postReel">
                <button id="post"><img src="post.png" alt=""></button>
                <button id="post"><img src="post.png" alt=""></button>
            </div>
            <div class="postes">
                <img src="landing-2x.png" alt="" srcset="">
                <img src="landing-2x.png" alt="" srcset="">
                <img src="landing-2x.png" alt="" srcset="">
                <img src="landing-2x.png" alt="" srcset="">
                <img src="landing-2x.png" alt="" srcset="">
                <img src="landing-2x.png" alt="" srcset="">
                <img src="landing-2x.png" alt="" srcset="">
                
            </div>
        </main>
        <nav class="bottom-nav">
                <a href="#" class="nav-item active"><i class="fa-solid fa-house"></i></a>
                <a href="#" class="nav-item"><i class="fa-solid fa-magnifying-glass"></i></a>
                <a href="#" class="nav-item"><i class="fa-solid fa-clapperboard"></i></a>
                <a href="#" class="nav-item"><i class="fa-regular fa-heart"></i></a>
                <a href="#" class="nav-item"><img src="100k-ai-faces-6.jpg" alt="Profile" class="nav-profile-pic"></a>
        </nav>
    </div>
</body>

</html>
